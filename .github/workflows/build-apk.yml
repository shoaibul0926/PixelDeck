name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web bundle and generate Android project
        run: |
          npm run build:web
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PixelDeck.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PixelDeck.apk \
            --title "PixelDeck (Android APK)" \
            --notes "Download PixelDeck.apk on your phone and install it. Built from commit ${GITHUB_SHA::7}." \
            --latest
