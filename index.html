<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelDeck — Game Hub</title>
  <meta name="description" content="PixelDeck: a retro arcade hub for browser games.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

  <!-- ===================== SPLASH / START SCREEN ===================== -->
  <div id="splashScreen" class="splash">
    <div class="splash-scanline"></div>
    <h1 class="logo splash-logo">PIXEL<span>DECK</span></h1>
    <p class="tagline splash-tagline">// retro arcade game hub //</p>
    <button id="startBtn" class="start-btn">▶ START</button>
  </div>

  <!-- ===================== HUB / GAME SELECT SCREEN ===================== -->
  <div id="hubScreen" class="hub-screen">
    <header class="site-header">
      <h1 class="logo">PIXEL<span>DECK</span></h1>
      <p class="tagline">// select a game //</p>
    </header>

    <main>
      <div class="game-grid" id="game-grid"></div>
    </main>

    <footer class="site-footer">
      <p>PixelDeck — a hub for independently built &amp; deployed HTML5 games.</p>
      <p class="credit">Made by <strong>SHOAIBUL HOQUE</strong></p>
    </footer>
  </div>

  <script src="js/games.js?v=2"></script>
  <script src="js/hub.js?v=2"></script>
</body>
</html>
