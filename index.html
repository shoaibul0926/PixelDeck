<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelDeck — Game Hub</title>
  <meta name="description" content="PixelDeck: a retro arcade hub for browser games.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <!-- ===================== LOGIN / SIGN UP GATE ===================== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1 class="logo login-logo">PIXEL<span>DECK</span></h1>
      <p class="tagline login-tagline" id="authFormTitle">LOG IN</p>
      <input type="text" id="authUsername" class="login-input" placeholder="Username" maxlength="20" autocomplete="username">
      <input type="password" id="authPassword" class="login-input" placeholder="Password" maxlength="60" autocomplete="current-password">
      <p class="login-error" id="authError"></p>
      <button id="authSubmitBtn" class="start-btn login-submit">▶ LOG IN</button>
      <a href="#" id="authSwitchLink" class="login-switch">New here? Create an account</a>
    </div>
  </div>

  <div id="welcomeBackToast" class="welcome-toast"></div>

  <!-- ===================== SPLASH / START SCREEN ===================== -->
  <div id="splashScreen" class="splash">
    <div class="splash-scanline"></div>
    <h1 class="logo splash-logo">PIXEL<span>DECK</span></h1>
    <p class="tagline splash-tagline">// retro arcade game hub //</p>
    <button id="startBtn" class="start-btn">▶ START</button>
  </div>

  <!-- ===================== HUB / GAME SELECT SCREEN ===================== -->
  <div id="hubScreen" class="hub-screen">
    <header class="site-header">
      <h1 class="logo">PIXEL<span>DECK</span></h1>
      <p class="tagline">// select a game //</p>
      <div id="userBadge" class="user-badge">
        <span>👤 <span id="userBadgeName">Player</span></span>
        <button id="logoutBtn" class="logout-btn">Log Out</button>
      </div>
    </header>

    <main>
      <div class="game-grid" id="game-grid"></div>
    </main>

    <footer class="site-footer">
      <p>PixelDeck — a hub for independently built &amp; deployed HTML5 games.</p>
      <p class="credit">Made by <strong>SHOAIBUL HOQUE</strong></p>
    </footer>
  </div>

  <script src="js/auth.js?v=1"></script>
  <script src="js/games.js?v=5"></script>
  <script src="js/hub.js?v=5"></script>
</body>
</html>
